version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kubersetu-backend
    ports:
      - "8000:8000"
    environment:
      - RISK_TOLERANCE_INR=500.00
      - CORS_ORIGINS=*
      - DATA_DIR=data
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kubersetu-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
