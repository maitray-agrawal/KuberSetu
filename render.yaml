services:
  - type: web
    name: kubersetu-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RISK_TOLERANCE_INR
        value: "500.00"
      - key: CORS_ORIGINS
        value: "*"
      - key: DATA_DIR
        value: "data"
