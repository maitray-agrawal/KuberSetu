services:
  - type: web
    name: kubersetu-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: RISK_TOLERANCE_INR
        value: "500.00"
      - key: CORS_ORIGINS
        # Set to the actual deployed Vercel frontend URL after deployment (e.g., https://kubersetu.vercel.app). Do not leave as wildcard in production.
        value: "https://kubersetu.vercel.app"
      - key: DATA_DIR
        value: "data"
